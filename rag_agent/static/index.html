<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法智通 — 智能法律案例检索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            DEFAULT: '#0b1118',
                            50:  '#faf8f4',
                            100: '#ece6db',
                            200: '#d4cdc0',
                            300: '#b0a89b',
                            400: '#7a746d',
                            500: '#5c5650',
                            600: '#3e3a35',
                            700: '#282420',
                            800: '#151a1e',
                            900: '#0b1118',
                        },
                        pine: {
                            DEFAULT: '#215a4d',
                            50:  '#eaf5f1',
                            100: '#d2ebe2',
                            200: '#a5d7c5',
                            300: '#6db89e',
                            400: '#3d8c74',
                            500: '#215a4d',
                            600: '#1a4840',
                            700: '#143732',
                            800: '#0e2624',
                            900: '#091816',
                        },
                        paper: {
                            DEFAULT: '#faf8f4',
                            50:  '#fefdfb',
                            100: '#faf8f4',
                            200: '#f3efe8',
                            300: '#ece6db',
                        },
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
                        sans: ['"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    animation: {
                        'reveal': 'reveal 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'reveal-up': 'revealUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
                        'shimmer': 'shimmer 2s infinite',
                    },
                    keyframes: {
                        reveal: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        revealUp: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shimmer: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.3' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }

        /* ── Scrollbar ── */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #d4cdc0; border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: #b0a89b; }

        /* ── Message content typography ── */
        .message-body p { margin-bottom: 0.6rem; line-height: 1.75; }
        .message-body p:last-child { margin-bottom: 0; }
        .message-body strong { font-weight: 600; color: #282420; }
        .message-body ul, .message-body ol { margin: 0.5rem 0 0.5rem 1.4rem; }
        .message-body li { margin-bottom: 0.3rem; }
        .message-body h2, .message-body h3, .message-body h4 {
            font-family: "Noto Serif SC", Georgia, serif;
            font-weight: 600;
            margin: 1rem 0 0.5rem;
            color: #1a4840;
        }
        .message-body h3 { font-size: 1.05rem; }
        .message-body h4 { font-size: 0.95rem; }
        .message-body hr { margin: 1rem 0; border: none; border-top: 1px solid #ece6db; }
        .message-body code {
            background: #f3efe8;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.88em;
            color: #5c5650;
        }
        .message-body a { color: #215a4d; text-decoration: underline; text-underline-offset: 2px; }
        .message-body blockquote {
            border-left: 3px solid #215a4d;
            padding-left: 1rem;
            margin: 0.6rem 0;
            color: #5c5650;
            font-style: italic;
        }

        /* ── Case citation badge ── */
        .case-cite {
            display: inline-block;
            background: #eaf5f1;
            color: #1a4840;
            border: 1px solid #d2ebe2;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.88em;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .case-cite:hover {
            background: #d2ebe2;
            border-color: #a5d7c5;
        }

        /* ── Session item ── */
        .session-item {
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }
        .session-item:hover { background: rgba(255,255,255,0.04); }
        .session-item.active {
            background: rgba(33,90,77,0.12);
            border-left-color: #215a4d;
        }

        /* ── Input focus ring ── */
        .chat-input-area:focus-within {
            box-shadow: 0 0 0 2px rgba(33,90,77,0.25);
            border-color: #215a4d;
        }

        /* ── Mobile sidebar ── */
        .sidebar-backdrop {
            transition: opacity 0.3s ease;
        }
        .sidebar-panel {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ── Suggestion cards ── */
        .suggest-card {
            transition: all 0.25s ease;
        }
        .suggest-card:hover {
            background: #f3efe8;
            border-color: #215a4d;
            transform: translateY(-2px);
        }

        /* ── Button transitions ── */
        .btn-send {
            transition: all 0.2s ease;
        }
        .btn-send:not(:disabled):hover {
            background: #1a4840;
            transform: scale(1.03);
        }
        .btn-send:not(:disabled):active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-ink min-h-screen text-ink-400 font-sans antialiased">

    <!-- ============================================================ -->

                    <input id="sidebar-username" type="text" maxlength="64" autocomplete="username"

                    <div class="flex gap-2">
                        <button id="sidebar-login-btn"
                                class="flex-1 bg-pine hover:bg-pine-600 text-white text-sm font-medium py-2 rounded-lg transition-colors">
                            登录

                        <button id="sidebar-register-btn"
                                class="flex-1 bg-white/[0.05] hover:bg-white/[0.1] text-ink-200 text-sm font-medium py-2 rounded-lg border border-white/[0.08] transition-colors">

                        </button>
                    </div>
                </div>

                <div id="sidebar-auth-logged-in" class="hidden">
                    <div class="flex items-center justify-between">

        <!-- Sidebar overlay (mobile) -->

        <!-- ======================================================== -->
        <!-- Main Chat Area -->
        <!-- ======================================================== -->
        <main class="flex-1 flex flex-col min-w-0 bg-paper">

            <!-- Top bar -->
            <header class="flex items-center justify-between px-5 py-3 bg-ink border-b border-white/[0.06] shrink-0">

                                <line x1="12" y1="2" x2="12" y2="22"/>
                                <path d="M3 7l4.5 2.5L12 7l4.5 2.5L21 7"/>
                                <path d="M5 10.5v6a3 3 0 0 0 5.5 0v-6"/>
                                <path d="M13.5 10.5v6a3 3 0 0 0 5.5 0v-6"/>

                                    class="suggest-card w-full text-left bg-white border border-paper-300 rounded-xl px-4 py-3.5 text-sm text-ink-700 hover:border-pine/30 transition-all group">
                                <span class="text-pine text-xs font-medium">民事</span>

                                <span class="float-right text-ink-200 group-hover:text-pine-300 transition-colors">↗</span>

                            <button onclick="tryExample('指导案例24号涉及什么法律问题？')"

                                onclick="sendMessage()"

    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
    /**
     * 法智通 — 前端逻辑
     * 会话管理 · 认证 · SSE 流式聊天
     */
    'use strict';

    // ── State ──
    const STATE = {
        currentSessionId: null,
        sessions: [],
        messages: [],
        isLoading: false,
        token: localStorage.getItem('legal_api_token') || '',
        username: localStorage.getItem('legal_username') || '',
        streamController: null,
    };

    const API_BASE = window.location.origin;

    // ── DOM refs ──
    const $  = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    const chatMessages  = $('#chat-messages');
    const chatInput     = $('#chat-input');
    const sendBtn       = $('#send-btn');
    const sessionList   = $('#session-list');
    const welcomeMsg    = $('#welcome-message');
    const newSessionBtn = $('#new-session-btn');
    const sessionIdDisp = $('#session-id-display');
    const sidebar       = $('#sidebar');
    const overlay       = $('#sidebar-overlay');

    // ── Sidebar ──
    function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    }
    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }

    function closeSidebarOnMobile() {
        if (window.innerWidth < 1024) closeSidebar();
    }

    // ── Input ──
    function onInputChange(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 128) + 'px';
        sendBtn.disabled = !el.value.trim() || STATE.isLoading;
    }

    function onInputKeydown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    }

    function formatTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ── Auth helpers ──
    function authHeaders(extra) {
        return STATE.token ? { ...extra, Authorization: `Bearer ${STATE.token}` } : { ...extra };
    }

    // ── Auth UI ──
    function updateAuthUI() {
        const loggedIn = Boolean(STATE.token);
        const user = STATE.username || '';

        // Sidebar auth panels
        const outDiv = $('#sidebar-auth-logged-out');
        const inDiv  = $('#sidebar-auth-logged-in');
        if (outDiv) outDiv.classList.toggle('hidden', loggedIn);
        if (inDiv)  inDiv.classList.toggle('hidden', !loggedIn);

        const nameDisp = $('#sidebar-username-display');
        const avatar   = $('#sidebar-avatar-letter');
        if (nameDisp) nameDisp.textContent = loggedIn ? user : '';
        if (avatar)   avatar.textContent   = loggedIn ? (user[0] || '?').toUpperCase() : '?';

        // Controls
        newSessionBtn.disabled = !loggedIn;
        chatInput.disabled     = !loggedIn;
        if (!loggedIn) chatInput.placeholder = '请先登录后开始咨询';
    }

    function clearLoginState(msg) {
        localStorage.removeItem('legal_api_token');
        localStorage.removeItem('legal_username');
        STATE.token = '';
        STATE.username = '';
        // Clear all password fields
        $$('input[type="password"]').forEach(el => el.value = '');
        // Reset conversation
        if (STATE.streamController) STATE.streamController.abort();
        STATE.streamController = null;
        STATE.isLoading = false;
        STATE.currentSessionId = null;
        STATE.sessions = [];
        STATE.messages = [];
        sessionIdDisp.textContent = '';
        renderSessionList();
        renderMessages();
        updateAuthUI();
        if (msg) alert(msg);
    }

    async function responseError(resp) {
        const payload = await resp.json().catch(() => ({}));
        const map = {
            401: '登录已失效，请重新登录。',
            404: '会话不存在或无权访问。',
            413: '请求内容过大，请缩短问题后重试。',
            429: '请求过于频繁，请稍后再试。',
        };
        const err = new Error(map[resp.status] || payload.error || `请求失败（HTTP ${resp.status}）`);
        err.status = resp.status;
        if (resp.status === 401) clearLoginState(map[401]);
        return err;
    }

    // ── API ──
    async function apiGet(url) {
        const resp = await fetch(API_BASE + url, { headers: authHeaders() });
        if (!resp.ok) throw await responseError(resp);
        return resp.json();
    }

    async function apiPost(url, body) {
        const resp = await fetch(API_BASE + url, {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(body),
        });
        if (!resp.ok) throw await responseError(resp);
        return resp.json();
    }

    async function submitAuth(action) {
        const username = ($('#sidebar-username')?.value || '').trim();
        const password = ($('#sidebar-password')?.value || '');
        if (!username || !password) return alert('请输入账号和密码。');

        const resp = await fetch(`${API_BASE}/api/auth/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            const known = {
                400: '账号格式或密码长度不正确。',
                401: '账号或密码错误。',
                409: '该账号已注册，请直接登录。',
                429: '尝试次数过多，请稍后再试。',
            };
            return alert(known[resp.status] || data.error || '操作失败。');
        }

        // Reset state
        if (STATE.streamController) STATE.streamController.abort();
        STATE.streamController = null;
        STATE.isLoading = false;
        STATE.currentSessionId = null;
        STATE.sessions = [];
        STATE.messages = [];
        sessionIdDisp.textContent = '';

        STATE.token = data.token;
        STATE.username = data.username;
        localStorage.setItem('legal_api_token', STATE.token);
        localStorage.setItem('legal_username', STATE.username);
        updateAuthUI();
        renderMessages();
        await fetchSessions();
        if (STATE.sessions.length) await switchSession(String(STATE.sessions[0].id));
    }

    // ── Sessions ──
    async function fetchSessions() {
        if (!STATE.token) { STATE.sessions = []; renderSessionList(); return; }
        try {
            const data = await apiGet('/api/sessions');
            STATE.sessions = data.sessions || [];
            renderSessionList();
        } catch (e) {
            console.error('获取会话失败:', e);
            sessionList.innerHTML =
                `<div class="text-center py-8 text-ink-300 text-sm">
                    <p>${escapeHtml(e.message || '无法连接')}</p>
                    <button class="text-pine-300 hover:underline mt-2 text-xs" onclick="fetchSessions()">重试</button>
                </div>`;
        }
    }

    function renderSessionList() {
        if (!STATE.sessions.length) {
            sessionList.innerHTML =
                `<div class="text-center py-10 text-ink-300 text-sm">
                    <svg class="w-6 h-6 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.86 9.86 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    暂无对话<br><span class="text-[11px] opacity-50">点击上方按钮开始</span>
                </div>`;
            return;
        }
        sessionList.innerHTML = '';
        STATE.sessions.forEach(s => {
            const active = s.id === STATE.currentSessionId;
            const el = document.createElement('div');
            el.className = `session-item rounded-lg px-3 py-2.5 cursor-pointer ${active ? 'active' : ''}`;
            el.innerHTML = `
                <p class="text-sm text-white/80 truncate font-medium">${escapeHtml(s.preview || '(空会话)')}</p>
                <p class="text-[11px] text-ink-300 mt-0.5">${Number(s.message_count) || 0} 条消息</p>
            `;
            el.addEventListener('click', () => switchSession(String(s.id)));
            sessionList.appendChild(el);
        });
    }

    async function switchSession(sessionId) {
        if (sessionId === STATE.currentSessionId) return;
        STATE.currentSessionId = sessionId;
        STATE.messages = [];
        renderSessionList();
        sessionIdDisp.textContent = sessionId.slice(0, 8) + '…';
        closeSidebarOnMobile();
        showLoadingMessages();
        try {
            const data = await apiGet(`/api/sessions/${encodeURIComponent(sessionId)}/messages`);
            STATE.messages = data.messages || [];
            renderMessages();
        } catch (e) {
            console.error('加载消息失败:', e);
            showErrorMessages('加载失败，请重试');
        }
    }

    async function createNewSession() {
        if (!STATE.token) return alert('请先登录。');
        try {
            const data = await apiPost('/api/sessions', {});
            STATE.currentSessionId = data.session_id;
            STATE.messages = [];
            await fetchSessions();
            renderMessages();
            sessionIdDisp.textContent = data.session_id.slice(0, 8) + '…';
            chatInput.disabled = false;
            chatInput.focus();
            closeSidebarOnMobile();
        } catch (e) {
            console.error('创建会话失败:', e);
            alert('创建会话失败，请检查服务器状态');
        }
    }

    function tryExample(query) {
        chatInput.value = query;
        chatInput.dispatchEvent(new Event('input'));
        chatInput.focus();
        // Prompt user to create session first if not logged in
        if (!STATE.token) {
            alert('请先在左侧登录。');
        } else if (!STATE.currentSessionId) {
            createNewSession().then(() => {
                if (STATE.currentSessionId) {
                    chatInput.value = query;
                    chatInput.dispatchEvent(new Event('input'));
                    sendMessage();
                }
            });
        } else {
            sendMessage();
        }
    }

    // ── Messages ──
    function renderMessages() {
        const w = $('#welcome-message');
        if (w) w.remove();
        chatMessages.querySelectorAll('.message-row').forEach(el => el.remove());

        if (!STATE.messages.length) {
            showWelcome();
            return;
        }
        STATE.messages.forEach(m => addMessageBubble(m.role, m.content));
        scrollToBottom();
    }

    function showWelcome() {
        chatMessages.innerHTML = `
            <div id="welcome-message" class="flex flex-col items-center justify-center min-h-full px-6 py-16">
                <div class="max-w-lg w-full text-center animate-reveal">
                    <div class="mb-8">
                        <svg class="w-12 h-12 mx-auto text-pine-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="2" x2="12" y2="22"/>
                            <path d="M3 7l4.5 2.5L12 7l4.5 2.5L21 7"/>
                            <path d="M5 10.5v6a3 3 0 0 0 5.5 0v-6"/>
                            <path d="M13.5 10.5v6a3 3 0 0 0 5.5 0v-6"/>
                        </svg>
                    </div>
                    <h2 class="font-serif text-2xl font-bold text-ink-800 mb-3 tracking-tight">新对话已就绪</h2>
                    <p class="text-ink-400 text-sm">在下方输入您的法律问题，开始咨询</p>
                </div>
            </div>`;
    }

    function showLoadingMessages() {
        const w = $('#welcome-message'); if (w) w.remove();
        chatMessages.querySelectorAll('.message-row').forEach(el => el.remove());
        chatMessages.innerHTML = `
            <div class="flex items-center justify-center min-h-full text-ink-300 text-sm">
                <div class="text-center">
                    <svg class="w-6 h-6 mx-auto mb-2 animate-spin opacity-30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                    </svg>
                    加载中…
                </div>
            </div>`;
    }

    function showErrorMessages(msg) {
        const w = $('#welcome-message'); if (w) w.remove();
        chatMessages.querySelectorAll('.message-row').forEach(el => el.remove());
        chatMessages.innerHTML = `
            <div class="flex items-center justify-center min-h-full text-sm">
                <div class="text-center text-ink-400">
                    <svg class="w-8 h-8 mx-auto mb-2 text-red-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    ${escapeHtml(msg)}
                    <button onclick="fetchSessions()" class="block mx-auto mt-2 text-pine hover:underline text-xs">重试</button>
                </div>
            </div>`;
    }

    // ── Message bubbles ──
    function addMessageBubble(role, content) {
        const w = $('#welcome-message'); if (w) w.remove();
        const isUser = role === 'user';
        const isSystem = role === 'system';

        const row = document.createElement('div');
        row.className = 'message-row animate-reveal-up';

        if (isUser) {
            row.innerHTML = `
                <div class="flex justify-end px-5 py-3">
                    <div class="max-w-[75%]">
                        <div class="bg-ink text-white rounded-2xl rounded-br-md px-4 py-3">
                            <div class="message-body text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(content)}</div>
                        </div>
                        <p class="text-[11px] text-ink-300 mt-1 text-right">${formatTime()}</p>
                    </div>
                </div>`;
        } else if (isSystem) {
            row.innerHTML = `
                <div class="flex justify-center px-5 py-3">
                    <div class="max-w-[85%] bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-2.5">
                        <div class="message-body text-xs leading-relaxed">${renderMarkdown(content)}</div>
                    </div>
                </div>`;
        } else {
            row.innerHTML = `
                <div class="flex justify-start px-5 py-3">
                    <div class="flex gap-3 max-w-[80%]">
                        <div class="w-8 h-8 rounded-full bg-pine/10 flex items-center justify-center shrink-0 mt-0.5">
                            <svg class="w-4 h-4 text-pine" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <line x1="12" y1="2" x2="12" y2="22"/>
                                <path d="M3 7l4.5 2.5L12 7l4.5 2.5L21 7"/>
                            </svg>
                        </div>
                        <div>
                            <div class="bg-white border border-paper-300 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm">
                                <div class="message-body text-sm leading-relaxed">${renderMarkdown(content)}</div>
                            </div>
                            <p class="text-[11px] text-ink-300 mt-1">${formatTime()}</p>
                        </div>
                    </div>
                </div>`;
        }
        chatMessages.appendChild(row);
    }

    function createStreamingBubble() {
        const w = $('#welcome-message'); if (w) w.remove();
        const row = document.createElement('div');
        row.className = 'message-row animate-reveal-up';
        row.id = 'streaming-row';
        row.innerHTML = `
            <div class="flex justify-start px-5 py-3">
                <div class="flex gap-3 max-w-[80%]">
                    <div class="w-8 h-8 rounded-full bg-pine/10 flex items-center justify-center shrink-0 mt-0.5">
                        <svg class="w-4 h-4 text-pine" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="2" x2="12" y2="22"/>
                            <path d="M3 7l4.5 2.5L12 7l4.5 2.5L21 7"/>
                        </svg>
                    </div>
                    <div>
                        <div class="bg-white border border-paper-300 rounded-2xl rounded-tl-md px-4 py-3 shadow-sm">
                            <div class="stream-content message-body text-sm leading-relaxed"></div>
                        </div>
                        <p class="text-[11px] text-ink-300 mt-1">${formatTime()}</p>
                    </div>
                </div>
            </div>`;
        chatMessages.appendChild(row);
        return row;
    }

    // ── Send message ──
    async function sendMessage() {
        if (!STATE.token) return alert('请先登录。');
        const text = chatInput.value.trim();
        if (!text || STATE.isLoading) return;

        if (!STATE.currentSessionId) {
            await createNewSession();
            if (!STATE.currentSessionId) return;
        }

        chatInput.value = '';
        chatInput.style.height = 'auto';
        sendBtn.disabled = true;

        addMessageBubble('user', text);
        scrollToBottom();

        STATE.isLoading = true;
        sendBtn.disabled = true;

        const row = createStreamingBubble();
        const contentDiv = row.querySelector('.stream-content');
        scrollToBottom();

        try {
            STATE.streamController = new AbortController();
            const resp = await fetch(API_BASE + '/api/chat/stream', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                signal: STATE.streamController.signal,
                body: JSON.stringify({ message: text, session_id: STATE.currentSessionId }),
            });

            if (!resp.ok) throw await responseError(resp);
            if (!resp.body) throw new Error('浏览器不支持流式读取');

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '', fullContent = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || !trimmed.startsWith('data: ')) continue;
                    try {
                        const evt = JSON.parse(trimmed.slice(6));
                        if (evt.type === 'meta') {
                            STATE.currentSessionId = evt.session_id;
                            sessionIdDisp.textContent = evt.session_id.slice(0, 8) + '…';
                        } else if (evt.type === 'chunk') {
                            fullContent += evt.content;
                            if (contentDiv) contentDiv.innerHTML = renderMarkdown(fullContent);
                            scrollToBottom();
                        } else if (evt.type === 'error') {
                            throw new Error(evt.content);
                        }
                    } catch (e) {
                        if (e.message?.startsWith?.('服务器') || e.message?.startsWith?.('HTTP')) throw e;
                    }
                }
            }
            row.id = '';
            await fetchSessions();
        } catch (e) {
            if (e.name === 'AbortError') return;
            console.error('对话失败:', e);
            if (contentDiv) {
                contentDiv.innerHTML = `<p class="text-red-500">抱歉，对话出错：${escapeHtml(e.message)}</p>`;
            }
        } finally {
            STATE.streamController = null;
            STATE.isLoading = false;
            sendBtn.disabled = !chatInput.value.trim();
            scrollToBottom();
        }
    }

    // ── Markdown ──
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function renderMarkdown(text) {
        if (!text) return '';
        let html = escapeHtml(text);

        // Paragraphs
        html = html.replace(/\n\n+/g, '</p><p>');
        html = html.replace(/\n/g, '<br>');
        html = '<p>' + html + '</p>';

        // Bold
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Headings
        html = html.replace(/<p>#{3}\s+(.+?)<\/p>/g, '<h4>$1</h4>');
        html = html.replace(/<p>#{2}\s+(.+?)<\/p>/g, '<h3>$1</h3>');
        html = html.replace(/<p>#{1}\s+(.+?)<\/p>/g, '<h2>$1</h2>');

        // Unordered list items
        html = html.replace(/<p>(?:<br>)?\s*[\*\-]\s+(.+?)<\/p>/g, '<li>$1</li>');
        html = html.replace(/((?:<li>.*?<\/li>\s*)+)/g, '<ul>$1</ul>');

        // Ordered list items
        html = html.replace(/<p>(?:<br>)?\s*(\d+)[\.\)]\s+(.+?)<\/p>/g, '<li>$2</li>');
        html = html.replace(/((?:<li>.*?<\/li>\s*)+)/g, (match) => {
            if (match.includes('<ul>')) return match;
            return '<ol>$1</ol>';
        });

        // Horizontal rule
        html = html.replace(/<p>-{3,}<\/p>/g, '<hr>');

        // Blockquote
        html = html.replace(/<p>&gt;\s*(.+?)<\/p>/g, '<blockquote>$1</blockquote>');

        // Cleanup
        html = html.replace(/<p><\/p>/g, '');
        html = html.replace(/<p>\s*<\/p>/g, '');

        // Case citation detection: highlight patterns like 指导案例XX号, 检例第XX号
        html = html.replace(
            /(指导案例\s*第?\s*\d+[一-鿿]*号|检例\s*第\s*\d+号|〔\d{4}〕\S+号)/g,
            '<span class="case-cite">$1</span>'
        );

        return html || text;
    }

    // ── Init ──
    async function init() {
        // Fill username if saved
        const su = $('#sidebar-username');
        if (su) su.value = STATE.username;
        updateAuthUI();

        // Auth buttons
        $('#sidebar-login-btn')?.addEventListener('click', () => submitAuth('login'));
        $('#sidebar-register-btn')?.addEventListener('click', () => submitAuth('register'));
        $('#sidebar-logout-btn')?.addEventListener('click', async () => {
            try { await apiPost('/api/auth/logout', {}); }
            finally { clearLoginState(); }
        });

        // Enter key on password field to login
        $('#sidebar-password')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitAuth('login');
        });

        // New session button
        newSessionBtn.addEventListener('click', createNewSession);

        // Input change
        chatInput.addEventListener('input', () => {
            sendBtn.disabled = !chatInput.value.trim() || STATE.isLoading;
        });

        // Restore session
        if (STATE.token) {
            try {
                const me = await apiGet('/api/auth/me');
                STATE.username = me.username;
                localStorage.setItem('legal_username', STATE.username);
                updateAuthUI();
                await fetchSessions();
                if (STATE.sessions.length > 0) {
                    await switchSession(String(STATE.sessions[0].id));
                }
            } catch (e) {
                console.error('恢复登录失败:', e);
            }
        }

        // Resize handler
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
